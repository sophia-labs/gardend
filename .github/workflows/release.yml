# Public release pipeline for the sophia-labs/gardend export. Lives inert in
# the private repo (no private-repo GitHub CI, per the Rampart ruling); the
# export assembly places it at .github/workflows/release.yml in the public tree.
#
# On a v* tag: build gardend for each target, then publish a GitHub Release
# with one tar.gz per target, SHA256SUMS, and release.json (the manifest
# `gardend update` reads, carrying the binary's storageFormat), and push the
# container image ghcr.io/sophia-labs/gardend:<version> + :latest.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, native: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, native: true }
          - { target: aarch64-apple-darwin, os: macos-14, native: true }
          - { target: x86_64-apple-darwin, os: macos-14, native: false }
    steps:
      - uses: actions/checkout@v4

      - name: Native build dependencies (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev

      - name: Native build dependencies (macOS)
        if: runner.os == 'macOS'
        run: command -v cmake || brew install cmake

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Tag matches the crate version
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)"
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME != src-tauri/Cargo.toml $have"; exit 1; }

      - name: Build gardend
        run: >
          cargo build --release --locked --target ${{ matrix.target }}
          --manifest-path src-tauri/Cargo.toml
          --no-default-features --features headless --example gardend

      - name: Package
        shell: bash
        run: |
          name="gardend-${GITHUB_REF_NAME}-${{ matrix.target }}"
          bin="src-tauri/target/${{ matrix.target }}/release/examples/gardend"
          mkdir -p "dist/$name"
          cp "$bin" LICENSE NOTICE.md THIRD-PARTY-RUST.md README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
          if [ "${{ matrix.native }}" = "true" ]; then
            "$bin" --version --json | tee "dist/version-${{ matrix.target }}.json"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums and manifest
        working-directory: dist
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Every natively-run build must agree on version and storage format.
          formats="$(jq -r '.storageFormat' version-*.json | sort -u)"
          versions="$(jq -r '.version' version-*.json | sort -u)"
          [ "$(wc -l <<<"$formats")" = 1 ] || { echo "storageFormat disagrees: $formats"; exit 1; }
          [ "$versions" = "$version" ] || { echo "binary version $versions != tag $version"; exit 1; }
          rm -f version-*.json
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          assets="{}"
          for f in *.tar.gz; do
            t="${f#gardend-${GITHUB_REF_NAME}-}"; t="${t%.tar.gz}"
            assets="$(jq -c --arg t "$t" --arg f "$f" '. + {($t): $f}' <<<"$assets")"
          done
          jq -n --arg v "$version" --argjson s "$formats" --argjson a "$assets" \
            '{name: "gardend", version: $v, storageFormat: $s, assets: $a}' > release.json
          cat release.json

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "gardend $GITHUB_REF_NAME" \
            --notes "Bare-binary installs: \`gardend update\` (checksum-verified; refuses while serving or across a storage-format change). Containers: \`docker pull ghcr.io/sophia-labs/gardend:${GITHUB_REF_NAME#v}\`. See docs/headless-gardend.md."

  image:
    name: container image (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image tags
        id: tags
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "tags=$repo:${GITHUB_REF_NAME#v},$repo:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gardend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
