[package]
name = "sophia-shell"
version = "0.1.0"
description = "Sophia: self-hosted Sophia in a native window, with the engine, UI, chat and Sophia Compute inside it"
edition = "2021"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
publish = false

[[bin]]
name = "sophia"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde_json = "1"

[profile.release]
codegen-units = 16
lto = false
strip = true

[workspace]
